<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppForm Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Custom CSS Sheet -->
  <link href="/assets/css/style.css" rel="stylesheet">
  <!-- Include external utility libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-solid fa-cubes-stacked"></i>
        <span>AppForm</span>
      </div>

      <!-- Navigation links populated dynamically -->
      <ul class="nav-menu" id="sidebarMenu">
        <!-- JS builds these menu items -->
      </ul>

      <!-- User section bottom -->
      <div class="mt-auto pt-4 border-top border-glass">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; font-weight: bold;" id="userInitials">
            U
          </div>
          <div>
            <h6 class="mb-0 text-white" id="navUsername">Username</h6>
            <small class="text-muted" id="navUserRole">Role</small>
          </div>
        </div>
        <button class="btn btn-outline-danger w-100 btn-sm rounded-3" id="logoutBtn">
          <i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Log Out
        </button>
      </div>
    </aside>

    <!-- Main View Panel -->
    <main class="main-content">
      <div id="viewContainer">
        <!-- Pages get rendered here by app.js -->
      </div>
    </main>
  </div>

  <!-- Dynamic Application Script Router & Render Helpers -->
  <script src="/assets/js/renderer.js"></script>
  <script src="/assets/js/builder.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
