<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AppForm Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Custom Style -->
  <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body class="auth-wrapper">

  <div class="glass-panel auth-card">
    <div class="logo justify-content-center">
      <i class="fa-solid fa-cubes-stacked"></i>
      <span>AppForm</span>
    </div>
    
    <h4 class="text-center mb-4 font-heading" style="font-weight: 600;">Welcome Back</h4>
    <p class="text-center text-muted mb-4">Please log in to your account</p>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-glass text-muted"><i class="fa-solid fa-user"></i></span>
          <input type="text" class="form-control" id="username" placeholder="Enter username" required autocomplete="username">
        </div>
      </div>
      
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-glass text-muted"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn btn-premium w-100 mb-3">
        Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
      </button>

      <div class="text-center text-muted" style="font-size: 13px;">
        <p class="mb-1">Demo Accounts:</p>
        <span class="badge bg-secondary">admin / admin123</span>
        <span class="badge bg-secondary">manager / manager123</span>
        <span class="badge bg-secondary">user / user123</span>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');
      
      alertBox.classList.add('d-none');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        // Set token in localStorage as backup
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Redirect to portal / dashboard
        window.location.href = '/';

      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
